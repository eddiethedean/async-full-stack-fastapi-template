name: Playwright Tests
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual {0} CI on {1}', github.ref_type, github.ref) || '' }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

permissions:
  contents: read
concurrency:
  # Isolate pushes and manual runs until the exact-ref gate runs.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check-push-branch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: $/.github/workflows/check-push-branch.yml
    permissions:
      actions: write
    with:
      cancel-older: true
      pushed-ref: ${{ github.event_name == 'push' && github.event.ref || github.ref }}

  changes:
    needs: check-push-branch
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-push-branch.outputs.matches == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - packages/react-email/**
            - bun.lock
            - uv.lock
            - pyproject.toml
            - package.json
            - .python-version
            - scripts/generate-client.sh
            - .env
            - .dockerignore
            - compose*.yml
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yml:compose.test.yml
      COMPOSE_PROJECT_NAME: asf-playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shardIndex }}
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "latest-known"
    - run: uv sync
      working-directory: backend
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - name: Verify the generated SDK
      run: |
        git diff --exit-code -- frontend/src/client
        test -z "$(git ls-files --others --exclude-standard -- frontend/src/client)"
    - name: Verify the exported email templates
      if: matrix.shardIndex == 1
      run: |
        bun run email:export
        git diff --exit-code -- backend/app/email-templates
        test -z "$(git ls-files --others --exclude-standard -- backend/app/email-templates)"
    - run: docker compose build
    - run: docker compose run --rm backend bash scripts/prestart.sh
    - name: Run Playwright tests
      id: playwright
      run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Remove test stack
      if: ${{ always() }}
      run: docker compose down -v --remove-orphans
    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: frontend/blob-report
        if-no-files-found: ${{ steps.playwright.outcome == 'success' && 'error' || 'warn' }}
        include-hidden-files: true
        retention-days: 1

  merge-playwright-reports:
    needs:
      - test-playwright
      - changes
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' && needs.test-playwright.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - name: Install dependencies
      run: bun ci
    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/playwright-blob-archives
        pattern: blob-report-*
        skip-decompress: true
    - name: Extract blob reports
      run: |
        set -euo pipefail
        # The action's streaming extractor can misread a nested Playwright ZIP.
        shopt -s nullglob
        archives="$RUNNER_TEMP/playwright-blob-archives"
        for archive in "$archives"/* "$archives"/blob-report-*/*; do
          if [[ -f "$archive" ]]; then
            unzip -oqj "$archive" '*.zip' -d frontend/all-blob-reports
          fi
        done
    - name: Merge into HTML Report
      run: bunx playwright merge-reports --reporter html ./all-blob-reports
      working-directory: frontend
    - name: Upload HTML report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always() && needs.changes.result != 'skipped'
    needs:
      - changes
      - test-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
