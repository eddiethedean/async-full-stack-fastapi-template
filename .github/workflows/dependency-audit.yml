name: Audit Dependencies

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate pushes until the exact-ref gate can cancel only older runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check-push-branch:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' && github.event.ref || github.ref) == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: $/.github/workflows/check-push-branch.yml
    permissions:
      actions: write
    with:
      cancel-older: true
      pushed-ref: ${{ github.event_name == 'push' && github.event.ref || github.ref }}

  audit:
    needs: check-push-branch
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-push-branch.outputs.matches == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"
      - name: Audit locked Python runtime dependencies
        run: uv audit --locked --no-dev --preview
      - name: Audit locked Bun runtime dependencies
        run: |
          filters=()
          if [[ "$(date -u +%F)" < "2026-12-18" ]]; then
            # Build-only picomatch dependency with no released fix. Review in #12.
            filters+=(--ignore=GHSA-fc5q-39xc-vjpf)
          fi
          bun audit --prod --audit-level=high "${filters[@]}"
