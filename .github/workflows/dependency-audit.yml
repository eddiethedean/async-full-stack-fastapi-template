name: Audit Dependencies

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'push' || github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"
      - name: Audit locked Python runtime dependencies
        run: uv audit --locked --no-dev --preview
      - name: Audit locked Bun runtime dependencies
        run: |
          filters=()
          if [[ "$(date -u +%F)" < "2026-12-18" ]]; then
            # Build-only picomatch dependency with no released fix. Review in #12.
            filters+=(--ignore=GHSA-fc5q-39xc-vjpf)
          fi
          bun audit --prod --audit-level=high "${filters[@]}"
