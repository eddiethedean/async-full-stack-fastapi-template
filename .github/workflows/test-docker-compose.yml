name: Test Docker Compose

on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  # Group push jobs only after the exact branch check to avoid case-insensitive ref collisions.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check-push-branch:
    if: github.event_name == 'push' && github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: $/.github/workflows/check-push-branch.yml
    with:
      pushed-ref: ${{ github.event.ref }}

  test-docker-compose:
    needs: check-push-branch
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-push-branch.outputs.matches == 'true') }}
    concurrency:
      group: ${{ github.workflow }}-test-docker-compose-${{ needs.check-push-branch.outputs.matches == 'true' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yml:compose.smoke.yml
      COMPOSE_PROJECT_NAME: asf-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SECRET_KEY: compose-smoke-tests-only-secret-key
      FIRST_SUPERUSER_PASSWORD: compose-smoke-tests-only-password
      POSTGRES_PASSWORD: compose-smoke-tests-only/postgres%2F
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_SSL: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAILS_FROM_EMAIL: smoke@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the disposable outbox key
        run: |
          keys=$(python3 -c 'import base64, json, secrets; print(json.dumps({"v1": base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()}))')
          printf '::add-mask::%s\n' "$keys"
          printf 'EMAIL_OUTBOX_KEYS=%s\n' "$keys" >> "$GITHUB_ENV"
      - run: docker compose build backend
      - name: Verify the manual deployment without mail
        run: |
          unset SMTP_HOST SMTP_PORT SMTP_TLS SMTP_SSL SMTP_USER SMTP_PASSWORD EMAILS_FROM_EMAIL EMAIL_OUTBOX_KEYS
          export DOMAIN=smoke.example.com PROJECT_NAME="Compose smoke test" FIRST_SUPERUSER=admin@example.com
          compose=(docker compose --env-file /dev/null --project-name "${COMPOSE_PROJECT_NAME}-no-mail" -f compose.yml -f compose.deploy.yml)
          trap '"${compose[@]}" down --volumes --remove-orphans' EXIT
          "${compose[@]}" run --rm --no-deps --pull never backend python -c 'from app.core.config import settings; assert not settings.emails_enabled'
          SMTP_HOST=smtp.example.com "${compose[@]}" config --format json | python -c '
          import json
          import sys

          services = json.load(sys.stdin)["services"]
          for name in ("backend", "email-worker"):
              env = services[name]["environment"]
              assert env["SMTP_HOST"] == "smtp.example.com"
              assert env["SMTP_PORT"] == "587"
              assert env["SMTP_TLS"] == "true"
              assert env["SMTP_SSL"] == "false"
          '
      - name: Verify production project, worker restart policy, and SMTP settings
        run: |
          project_dir=$(mktemp -d)
          trap 'rm -rf "$project_dir"' EXIT
          cp .env compose.yml compose.deploy.yml "$project_dir/"
          printf '\nCOMPOSE_PROJECT_NAME=asf-existing-stack\n' >> "$project_dir/.env"
          (
            cd "$project_dir"
            unset COMPOSE_PROJECT_NAME
            export DOMAIN=smoke.example.com PROJECT_NAME="Compose smoke test" FIRST_SUPERUSER=admin@example.com
            export SMTP_HOST="" SMTP_PORT="" SMTP_TLS="" SMTP_SSL="" SMTP_TIMEOUT_SECONDS=""
            export SMTP_USER="" SMTP_PASSWORD="" EMAILS_FROM_EMAIL="" EMAIL_OUTBOX_KEYS="" EMAIL_OUTBOX_KEY_VERSION=""
            python - <<'PY'
          import json
          import os
          import subprocess

          command = ["docker", "compose", "-f", "compose.yml", "-f", "compose.deploy.yml", "config", "--format", "json"]
          for host, sender in (("", ""), ("smtp.example.com", "sender@example.com")):
              env = {**os.environ, "SMTP_HOST": host, "EMAILS_FROM_EMAIL": sender}
              config = json.loads(subprocess.check_output(command, env=env))
              assert config["name"] == "asf-existing-stack"
              assert config["volumes"]["app-db-data"]["name"] == "asf-existing-stack_app-db-data"
              assert config["services"]["email-worker"]["restart"] == "unless-stopped"
              for name in ("backend", "email-worker"):
                  settings = config["services"][name]["environment"]
                  assert settings["SMTP_HOST"] == host
                  assert settings["EMAILS_FROM_EMAIL"] == sender
                  assert settings["SMTP_PORT"] == "587"
                  assert settings["SMTP_TLS"] == "true"
                  assert settings["SMTP_SSL"] == "false"
                  assert settings["SMTP_TIMEOUT_SECONDS"] == "15"
          PY
          )
      - run: docker compose up -d --wait db mailpit
      - name: Verify that migration stops the previous email worker
        run: |
          docker compose run --rm --no-deps --pull never backend bash scripts/prestart.sh
          docker compose up -d --wait --no-build email-worker
          test -n "$(docker compose ps --status running --quiet email-worker)"
          since=$(date +%s)
          bash scripts/migrate-compose.sh
          test -z "$(docker compose ps --status running --quiet email-worker)"
          docker events --since "$since" --until "$(( $(date +%s) + 1 ))" \
            --filter type=container --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            --format '{{.Action}} {{index .Actor.Attributes "com.docker.compose.service"}}' |
            awk '
              /^die email-worker$/ { stopped = 1 }
              /^start backend$/ && stopped { migrated_after_stop = 1 }
              END { exit !migrated_after_stop }
            '
      - run: docker compose up -d --wait --no-build backend email-worker
      - name: Verify the production runtime
        run: |
          docker compose exec -T backend python - <<'PY'
          import json
          import os
          from time import monotonic, sleep
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          assert os.getuid() != 0
          base = "http://localhost:8000"
          for path in ("/api/v1/utils/health-check/", "/api/v1/utils/readiness/"):
              with urlopen(base + path, timeout=5) as response:
                  assert response.status == 200, path
          with urlopen(base + "/api/v1/openapi.json", timeout=5) as response:
              assert "/api/v1/users/me" in json.load(response)["paths"]
          for path in ("/", "/login", "/items"):
              navigation = Request(base + path, headers={"Accept": "text/html"})
              with urlopen(navigation, timeout=5) as response:
                  assert response.headers.get_content_type() == "text/html", path
                  assert b'<div id="root">' in response.read(), path

          recipient = os.environ["FIRST_SUPERUSER"]
          recovery = Request(
              base + "/api/v1/password-recovery",
              data=json.dumps({"email": recipient}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urlopen(recovery, timeout=5) as response:
              assert response.status == 200

          mailpit = "http://mailpit:8025"
          query = urlencode({"query": f"to:{recipient}", "limit": 1})
          deadline = monotonic() + 30
          while monotonic() < deadline:
              with urlopen(f"{mailpit}/api/v1/search?{query}", timeout=5) as response:
                  messages = json.load(response)["messages"]
              if messages:
                  message_id = messages[0]["ID"]
                  with urlopen(f"{mailpit}/view/{message_id}.html", timeout=5) as response:
                      assert b"/reset-password?token=" in response.read()
                  break
              sleep(0.25)
          else:
              raise RuntimeError("The production email worker did not deliver the recovery message")
          PY
          docker compose exec -T email-worker python -c 'import os; assert os.getuid() != 0'
          docker compose exec -T email-worker python -m app.email_worker --healthcheck
      - name: Scan the built image for fixable high and critical vulnerabilities
        run: |
          container=$(docker compose ps --quiet backend)
          image=$(docker inspect --format '{{.Image}}' "$container")
          bash scripts/scan-production-image.sh "$image"
      - name: Remove smoke test stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
