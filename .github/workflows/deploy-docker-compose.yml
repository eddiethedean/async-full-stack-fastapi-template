name: Deploy with Docker Compose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docker-compose
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ENABLE_DOCKER_COMPOSE_DEPLOY == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      BACKEND_IMAGE: asf-backend:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DOMAIN: ${{ vars.DOMAIN }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ vars.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      # Keep Compose's project naming and override every mail setting, even when unset.
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_TLS: ${{ vars.SMTP_TLS }}
      SMTP_SSL: ${{ vars.SMTP_SSL }}
      SMTP_TIMEOUT_SECONDS: ${{ vars.SMTP_TIMEOUT_SECONDS }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_OUTBOX_KEYS: ${{ secrets.EMAIL_OUTBOX_KEYS }}
      EMAIL_OUTBOX_KEY_VERSION: ${{ vars.EMAIL_OUTBOX_KEY_VERSION }}
      EMAILS_FROM_EMAIL: ${{ vars.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
      DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
      DB_POOL_TIMEOUT_SECONDS: ${{ vars.DB_POOL_TIMEOUT_SECONDS }}
      DB_READINESS_TIMEOUT_SECONDS: ${{ vars.DB_READINESS_TIMEOUT_SECONDS }}
      MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES }}
      WEB_CONCURRENCY: ${{ vars.WEB_CONCURRENCY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      FORWARDED_ALLOW_IPS: ${{ vars.FORWARDED_ALLOW_IPS }}
      TRAEFIK_INGRESS_SUBNET: ${{ vars.TRAEFIK_INGRESS_SUBNET }}
      TRAEFIK_INGRESS_IP: ${{ vars.TRAEFIK_INGRESS_IP }}
      RATE_LIMIT_WINDOW_SECONDS: ${{ vars.RATE_LIMIT_WINDOW_SECONDS }}
      RATE_LIMIT_LOGIN_ACCOUNT: ${{ vars.RATE_LIMIT_LOGIN_ACCOUNT }}
      RATE_LIMIT_LOGIN_SOURCE: ${{ vars.RATE_LIMIT_LOGIN_SOURCE }}
      RATE_LIMIT_SIGNUP_ACCOUNT: ${{ vars.RATE_LIMIT_SIGNUP_ACCOUNT }}
      RATE_LIMIT_SIGNUP_SOURCE: ${{ vars.RATE_LIMIT_SIGNUP_SOURCE }}
      RATE_LIMIT_RECOVERY_ACCOUNT: ${{ vars.RATE_LIMIT_RECOVERY_ACCOUNT }}
      RATE_LIMIT_RECOVERY_SOURCE: ${{ vars.RATE_LIMIT_RECOVERY_SOURCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker compose -f compose.yml -f compose.deploy.yml build backend
      - name: Scan the deployment image
        run: bash scripts/scan-production-image.sh "$BACKEND_IMAGE"
      - name: Pull supporting service images
        run: docker compose -f compose.yml -f compose.deploy.yml pull --ignore-buildable
      - name: Start database
        run: docker compose -f compose.yml -f compose.deploy.yml up -d --wait --no-build --pull never db
      - name: Stop the previous email worker and migrate
        run: bash scripts/migrate-compose.sh -f compose.yml -f compose.deploy.yml
      - name: Start application
        run: docker compose -f compose.yml -f compose.deploy.yml up -d --wait --no-build --pull never
