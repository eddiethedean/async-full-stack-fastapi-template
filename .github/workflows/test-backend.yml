name: Test Backend

on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  # Isolate pushes until the exact-ref gate can cancel only older runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check-push-branch:
    if: github.event_name == 'push' && github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: $/.github/workflows/check-push-branch.yml
    permissions:
      actions: write
    with:
      cancel-older: true
      pushed-ref: ${{ github.event.ref }}

  test-backend:
    needs: check-push-branch
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-push-branch.outputs.matches == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - name: Run tests
        run: bash scripts/test.sh "Coverage for ${{ github.sha }}"
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          if-no-files-found: error
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend

  publish-coverage:
    needs: [check-push-branch, test-backend]
    if: >-
      github.event_name == 'push' &&
      needs.check-push-branch.outputs.matches == 'true' &&
      needs.test-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write

    steps:
      - name: Find coverage from the completed backend run
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=$(
            gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=coverage-html |
              jq -rs '[.[].artifacts[] | select(.name == "coverage-html" and .expired == false) | .id] | max // empty'
          )
          printf 'artifact-id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.coverage.outputs.artifact-id != ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.coverage.outputs.artifact-id != ''
        with:
          python-version-file: .python-version
      - name: Setup uv
        if: steps.coverage.outputs.artifact-id != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.coverage.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.coverage.outputs.artifact-id }}
          path: backend/htmlcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
      - run: uv run --locked --only-group github-actions smokeshow upload backend/htmlcov
        if: steps.coverage.outputs.artifact-id != ''
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 90
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }} # zizmor: ignore[secrets-outside-env]
