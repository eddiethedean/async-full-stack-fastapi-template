name: Deploy

on:
  push:
    branches: ['**']
    paths-ignore:
      - release-notes.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.ENABLE_FASTAPI_CLOUD_DEPLOY == 'true' &&
      (github.event_name != 'push' || github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment branch
        id: branch
        env:
          PUSH_REF: ${{ github.event.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # GitHub Actions expression comparisons ignore case.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$PUSH_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.branch.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        if: steps.branch.outputs.allowed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend dependencies
        if: steps.branch.outputs.allowed == 'true'
        run: bun ci
      - name: Build frontend
        if: steps.branch.outputs.allowed == 'true'
        run: bun run --filter frontend build
        env:
          # Override frontend/.env so the deployed frontend uses the same origin as the API
          VITE_API_URL: ""
          VITE_PROJECT_NAME: ${{ vars.VITE_PROJECT_NAME }}
          VITE_PROJECT_URL: ${{ vars.VITE_PROJECT_URL }}
      - name: Set up uv
        if: steps.branch.outputs.allowed == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - name: Prepare database
        if: steps.branch.outputs.allowed == 'true'
        run: uv run bash scripts/prestart.sh
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ vars.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      - name: Deploy to FastAPI Cloud
        if: steps.branch.outputs.allowed == 'true'
        run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
