name: Zizmor

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check-push-branch:
    if: github.event_name == 'push' && github.event.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: $/.github/workflows/check-push-branch.yml
    with:
      pushed-ref: ${{ github.event.ref }}

  zizmor:
    needs: check-push-branch
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.check-push-branch.outputs.matches == 'true') }}
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
