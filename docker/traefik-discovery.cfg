defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend discovery
    bind :2375
    acl discovery_method method GET HEAD
    # Docker negotiation may use unversioned paths. Traefik inspects containers by ID.
    acl discovery_path path_reg '^(/v[0-9]+\.[0-9]+)?/(_ping|version|containers/json|containers/[0-9a-f]{64}/json|events)$'
    http-request deny unless discovery_method discovery_path
    default_backend docker_engine

backend docker_engine
    server engine /var/run/docker.sock
