services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    image: ${BACKEND_IMAGE:-backend:latest}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment: &app-environment
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_READINESS_TIMEOUT_SECONDS: ${DB_READINESS_TIMEOUT_SECONDS:-1}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      EMAIL_OUTBOX_KEYS: ${EMAIL_OUTBOX_KEYS:-}
      EMAIL_OUTBOX_KEY_VERSION: ${EMAIL_OUTBOX_KEY_VERSION:-v1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-}
      RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-}
      RATE_LIMIT_LOGIN_SOURCE: ${RATE_LIMIT_LOGIN_SOURCE:-}
      RATE_LIMIT_SIGNUP_ACCOUNT: ${RATE_LIMIT_SIGNUP_ACCOUNT:-}
      RATE_LIMIT_SIGNUP_SOURCE: ${RATE_LIMIT_SIGNUP_SOURCE:-}
      RATE_LIMIT_RECOVERY_ACCOUNT: ${RATE_LIMIT_RECOVERY_ACCOUNT:-}
      RATE_LIMIT_RECOVERY_SOURCE: ${RATE_LIMIT_RECOVERY_SOURCE:-}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |-
          import os
          from urllib.request import urlopen

          timeout = float(os.environ["DB_READINESS_TIMEOUT_SECONDS"]) + 1
          with urlopen("http://localhost:8000/api/v1/utils/readiness/", timeout=timeout):
              pass
      interval: 10s
      timeout: 15s
      retries: 5

    build: &app-build
      context: .
      dockerfile: backend/Dockerfile
      target: production
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  email-worker:
    image: ${BACKEND_IMAGE:-backend:latest}
    build: *app-build
    depends_on:
      db:
        condition: service_healthy
    environment: *app-environment
    command: ["python", "-m", "app.email_worker"]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "app.email_worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-db-data:
